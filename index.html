<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header Navigasi -->
  <header class="bg-white px-6 py-3 border-b flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
      <i class="fa-solid fa-store text-teal-600"></i> Kasir POS
    </h1>
    <div class="flex gap-3">
      <button onclick="openMenuModal()" class="bg-gray-100 text-gray-700 font-semibold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-gray-200 text-sm">
        <i class="fa-solid fa-pen-to-square"></i> Kelola Menu
      </button>
      <button onclick="openHistoryModal()" class="bg-gray-100 text-gray-700 font-semibold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-gray-200 text-sm">
        <i class="fa-solid fa-receipt"></i> Riwayat Penjualan
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1600px] mx-auto">
    
    <!-- Kolom Kiri: Katalog & Filter (8/12) -->
    <section class="lg:col-span-8 space-y-4">
      <!-- Filter Kategori -->
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="filterCat('Semua')" class="bg-teal-600 text-white font-medium px-5 py-2 rounded-xl text-sm shadow-sm">Semua</button>
        <button onclick="filterCat('Makanan')" class="bg-white text-gray-600 hover:bg-gray-50 font-medium px-5 py-2 rounded-xl text-sm border">Makanan</button>
        <button onclick="filterCat('Minuman')" class="bg-white text-gray-600 hover:bg-gray-50 font-medium px-5 py-2 rounded-xl text-sm border">Minuman</button>
      </div>

      <!-- Grid Katalog Menu -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="menu-grid">
        <p class="col-span-full text-center text-gray-400 py-8">Memuat menu dari server...</p>
      </div>
    </section>

    <!-- Kolom Kanan: Kasir / Bill Saat Ini (4/12) -->
    <section class="lg:col-span-4 bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex flex-col justify-between">
      <div>
        <h2 class="font-bold text-lg text-gray-800 border-b pb-3 mb-4">Bill Saat Ini</h2>

        <!-- Daftar Item Keranjang -->
        <div class="space-y-3 max-h-[380px] overflow-y-auto pr-1" id="cart-items">
          <p class="text-center text-gray-400 py-8 text-xs">Belum ada item terpilih</p>
        </div>
      </div>

      <!-- Footer Pembayaran -->
      <div class="space-y-3 pt-4 border-t mt-4">
        <div class="flex justify-between items-center font-bold text-gray-800">
          <span class="text-sm">Total Harga:</span>
          <span class="text-lg text-teal-700" id="total-price-display">Rp 0</span>
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">Uang Diterima (Rp)</label>
          <input type="number" id="cash-input" oninput="calcChange()" placeholder="0" class="w-full border-2 border-orange-400 rounded-xl px-3 py-2 font-bold text-sm focus:outline-none">
        </div>

        <div class="flex justify-between items-center text-xs font-bold">
          <span class="text-gray-600">Kembalian:</span>
          <span class="text-emerald-600 text-sm" id="change-display">Rp 0</span>
        </div>

        <div class="grid grid-cols-1 gap-2 pt-1">
          <button onclick="processPayment()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-sm w-full">
            <i class="fa-solid fa-money-bill-wave mr-1"></i> Bayar Sekarang & Simpan
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal 1: Kelola & Edit Menu -->
  <div id="modal-menu" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-pen-to-square text-teal-600"></i> Kelola & Edit Menu</h3>
        <button onclick="closeModal('modal-menu')" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
      </div>

      <form id="form-menu" onsubmit="saveMenu(event)" class="space-y-3 bg-teal-50/50 p-4 rounded-xl border border-teal-100 mb-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Menu</label>
            <input type="text" id="menu-nama" required class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-teal-500" placeholder="Kopi Susu">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
            <select id="menu-kategori" class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-teal-500">
              <option value="Makanan">Makanan</option>
              <option value="Minuman">Minuman</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Harga (Rp)</label>
            <input type="number" id="menu-harga" required class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-teal-500" placeholder="18000">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Variasi / Opsi (Gunakan pemisah /)</label>
            <input type="text" id="menu-variasi" class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-teal-500" placeholder="Ice / Hot">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">URL Gambar (Opsional)</label>
          <input type="url" id="menu-img" class="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-teal-500" placeholder="https://...">
        </div>
        
        <div class="flex gap-2">
          <button type="submit" id="btn-submit-menu" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-lg text-xs shadow-sm">
            Simpan Menu ke Database
          </button>
          <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-3 py-2 rounded-lg text-xs">
            Batal
          </button>
        </div>
      </form>

      <h4 class="font-bold text-xs text-gray-700 mb-2">Daftar Menu Aktif:</h4>
      <div id="edit-menu-list" class="space-y-2 max-h-48 overflow-y-auto divide-y"></div>
    </div>
  </div>

  <!-- Modal 2: Pilihan Variasi (Ice / Hot) -->
  <div id="modal-variation" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl text-center">
      <h3 class="font-bold text-base text-gray-800 mb-1" id="variation-title">Pilih Opsi</h3>
      <p class="text-xs text-gray-400 mb-4">Silakan pilih variasi menu ini:</p>
      <div id="variation-options" class="space-y-2 mb-4">
        <!-- Pilihan opsi dirender dinamis -->
      </div>
      <button onclick="closeModal('modal-variation')" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-xs">
        Batal
      </button>
    </div>
  </div>

  <!-- Modal 3: Riwayat Penjualan -->
  <div id="modal-history" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-receipt text-teal-600"></i> Riwayat Penjualan</h3>
        <button onclick="closeModal('modal-history')" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
      </div>
      <div class="max-h-80 overflow-y-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b text-gray-600">
              <th class="p-2.5">ID TRX</th>
              <th class="p-2.5">Tanggal</th>
              <th class="p-2.5">Items</th>
              <th class="p-2.5 text-right">Total</th>
            </tr>
          </thead>
          <tbody id="history-table-body" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT ANDA
    const SCRIPT_URL = "GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA"; 

    let menuData = [];
    let cart = [];
    let totalPrice = 0;
    let editIndex = -1; // -1 = Tambah baru, >=0 = Edit menu
    let selectedItemForCart = null;

    // --- 1. SINKRONISASI DATA MENU ---
    async function loadMenu() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getMenu`);
        const data = await res.json();
        menuData = data.map(item => ({
          id: item[0],
          kategori: item[1],
          nama: item[2],
          harga: Number(item[3]),
          variasi: item[4],
          img: item[5] || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300'
        }));
        renderMenu(menuData);
      } catch (e) {
        console.error("Gagal memuat menu:", e);
      }
    }

    function renderMenu(items) {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      if(items.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">Menu tidak ditemukan</p>`;
        return;
      }
      items.forEach((item, index) => {
        grid.innerHTML += `
          <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <img src="${item.img}" class="w-full h-28 object-cover rounded-xl mb-2" alt="${item.nama}">
            <h3 class="font-bold text-sm text-gray-800">${item.nama}</h3>
            <p class="text-[10px] text-gray-400 mb-2">${item.variasi || '-'}</p>
            <div class="flex items-center justify-between mt-auto">
              <button onclick="handleAddToCart(${index})" class="bg-teal-50 text-teal-700 hover:bg-teal-100 px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1">
                <i class="fa-solid fa-plus text-[10px]"></i> Tambah
              </button>
              <span class="font-bold text-sm text-gray-900">Rp ${item.harga.toLocaleString()}</span>
            </div>
          </div>
        `;
      });
    }

    function filterCat(cat) {
      if (cat === 'Semua') renderMenu(menuData);
      else renderMenu(menuData.filter(m => m.kategori.toLowerCase() === cat.toLowerCase()));
    }

    // --- 2. PENANGANAN KERANJANG & OPSI VARIASI ---
    function handleAddToCart(index) {
      const item = menuData[index];
      
      if (item.variasi && item.variasi.trim() !== '' && item.variasi !== '-') {
        selectedItemForCart = item;
        const options = item.variasi.split('/').map(v => v.trim()).filter(v => v !== '');
        
        const optionsContainer = document.getElementById('variation-options');
        optionsContainer.innerHTML = '';
        
        options.forEach(opt => {
          optionsContainer.innerHTML += `
            <button onclick="confirmAddToCartWithVariation('${opt}')" class="w-full bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-2.5 px-4 rounded-xl text-xs border border-teal-200 transition">
              ${opt}
            </button>
          `;
        });

        document.getElementById('variation-title').innerText = item.nama;
        openModal('modal-variation');
      } else {
        addToCart(item.nama, item.harga, item.img);
      }
    }

    function confirmAddToCartWithVariation(variationOption) {
      if (selectedItemForCart) {
        addToCart(`${selectedItemForCart.nama} (${variationOption})`, selectedItemForCart.harga, selectedItemForCart.img);
        closeModal('modal-variation');
        selectedItemForCart = null;
      }
    }

    function addToCart(nama, harga, img) {
      const exist = cart.find(i => i.nama === nama);
      if (exist) { exist.qty += 1; } 
      else { cart.push({ nama, harga, img, qty: 1 }); }
      renderCart();
    }

    function updateQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      totalPrice = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-8 text-xs">Belum ada item terpilih</p>`;
        document.getElementById('total-price-display').innerText = 'Rp 0';
        calcChange();
        return;
      }

      cart.forEach((item, idx) => {
        const subtotal = item.harga * item.qty;
        totalPrice += subtotal;
        container.innerHTML += `
          <div class="flex items-center justify-between border-b pb-3">
            <div class="flex items-center gap-3">
              <img src="${item.img}" class="w-12 h-12 object-cover rounded-xl">
              <div>
                <p class="font-bold text-xs text-gray-800">${item.qty}x ${item.nama}</p>
                <p class="text-[10px] text-gray-400">(Rp ${item.harga.toLocaleString()} x ${item.qty})</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center border rounded-lg overflow-hidden bg-gray-50 mr-1">
                <button onclick="updateQty(${idx}, -1)" class="px-1.5 py-0.5 text-gray-500 hover:bg-gray-200 text-xs">-</button>
                <span class="px-2 text-xs font-semibold">${item.qty}</span>
                <button onclick="updateQty(${idx}, 1)" class="px-1.5 py-0.5 text-blue-600 hover:bg-blue-100 text-xs">+</button>
              </div>
              <span class="font-bold text-xs">Rp ${subtotal.toLocaleString()}</span>
              <button onclick="removeItem(${idx})" class="bg-red-50 text-red-400 hover:bg-red-100 p-1.5 rounded-lg"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-price-display').innerText = `Rp ${totalPrice.toLocaleString()}`;
      calcChange();
    }

    function calcChange() {
      const cash = Number(document.getElementById('cash-input').value) || 0;
      const change = cash - totalPrice;
      document.getElementById('change-display').innerText = `Rp ${change >= 0 ? change.toLocaleString() : 0}`;
    }

    // --- 3. PEMBAYARAN ---
    async function processPayment() {
      const cash = Number(document.getElementById('cash-input').value) || 0;
      if (cart.length === 0) return alert("Keranjang belanja masih kosong!");
      if (cash < totalPrice) return alert("Jumlah pembayaran kurang!");

      const payload = {
        action: "saveTransaction",
        id: "TRX-" + Date.now(),
        items: cart.map(i => `${i.qty}x ${i.nama}`).join(', '),
        total: totalPrice,
        bayar: cash,
        kembalian: cash - totalPrice
      };

      try {
        await fetch(https://script.google.com/macros/s/AKfycbw7INXTsx1gyifBgmSjBnY8zLpUgOdHtjbBVu8I4mgYJ7sQ531OS4YvssAN5W35rPeI/exec, { method: "POST", body: JSON.stringify(payload) });
        alert("Transaksi Sukses & Tersimpan ke Google Sheets!");
        cart = [];
        document.getElementById('cash-input').value = '';
        renderCart();
      } catch (e) {
        alert("Gagal menyimpan transaksi ke server.");
      }
    }

    // --- 4. KELOLA & EDIT MENU ---
    function openMenuModal() {
      cancelEdit();
      renderEditMenuList();
      openModal('modal-menu');
    }

    function renderEditMenuList() {
      const container = document.getElementById('edit-menu-list');
      container.innerHTML = '';
      menuData.forEach((item, index) => {
        container.innerHTML += `
          <div class="flex items-center justify-between py-2 text-xs">
            <div>
              <p class="font-bold text-gray-800">${item.nama} <span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-500">${item.kategori}</span></p>
              <p class="text-gray-400">Rp ${item.harga.toLocaleString()} | ${item.variasi || '-'}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="editMenu(${index})" class="text-blue-600 hover:text-blue-800 font-semibold px-2 py-1 bg-blue-50 rounded">Edit</button>
              <button onclick="deleteMenu(${index})" class="text-red-500 hover:text-red-700 font-semibold px-2 py-1 bg-red-50 rounded">Hapus</button>
            </div>
          </div>
        `;
      });
    }

    function editMenu(index) {
      editIndex = index;
      const item = menuData[index];

      document.getElementById('menu-nama').value = item.nama;
      document.getElementById('menu-kategori').value = item.kategori;
      document.getElementById('menu-harga').value = item.harga;
      document.getElementById('menu-variasi').value = item.variasi || '';
      document.getElementById('menu-img').value = item.img || '';

      document.getElementById('btn-submit-menu').innerText = "Perbarui Menu";
      document.getElementById('btn-cancel-edit').classList.remove('hidden');
    }

    function cancelEdit() {
      editIndex = -1;
      document.getElementById('form-menu').reset();
      document.getElementById('btn-submit-menu').innerText = "Simpan Menu ke Database";
      document.getElementById('btn-cancel-edit').classList.add('hidden');
    }

    async function saveMenu(e) {
      e.preventDefault();
      const nama = document.getElementById('menu-nama').value;
      const kategori = document.getElementById('menu-kategori').value;
      const harga = Number(document.getElementById('menu-harga').value);
      const variasi = document.getElementById('menu-variasi').value;
      const img = document.getElementById('menu-img').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300';

      if (editIndex >= 0) {
        menuData[editIndex] = { ...menuData[editIndex], nama, kategori, harga, variasi, img };
      } else {
        menuData.push({ id: Date.now(), kategori, nama, harga, variasi, img });
      }

      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateMenu", menu: menuData })
      });

      alert(editIndex >= 0 ? "Menu berhasil diperbarui!" : "Menu berhasil ditambahkan!");
      cancelEdit();
      renderMenu(menuData);
      renderEditMenuList();
    }

    async function deleteMenu(index) {
      if (confirm("Yakin ingin menghapus menu ini?")) {
        menuData.splice(index, 1);
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateMenu", menu: menuData })
        });
        renderMenu(menuData);
        renderEditMenuList();
      }
    }

    // --- 5. RIWAYAT PENJUALAN ---
    async function openHistoryModal() {
      openModal('modal-history');
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Memuat...</td></tr>`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getHistory`);
        const history = await res.json();
        tbody.innerHTML = '';
        if (history.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Belum ada riwayat.</td></tr>`;
          return;
        }
        history.forEach(row => {
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="p-2.5 font-bold text-gray-700">${row[0]}</td>
              <td class="p-2.5 text-gray-500">${row[1]}</td>
              <td class="p-2.5">${row[2]}</td>
              <td class="p-2.5 text-right font-bold text-emerald-600">Rp ${Number(row[3]).toLocaleString()}</td>
            </tr>
          `;
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">Gagal memuat.</td></tr>`;
      }
    }

    // --- UTILS MODAL ---
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }

    // Inisialisasi
    loadMenu();
  </script>
</body>
</html>

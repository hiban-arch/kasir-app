<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #receipt-print, #receipt-print * { visibility: visible; }
      #receipt-print { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header Navigasi -->
  <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">POS KASIR WEB</h1>
    <div class="space-x-2">
      <button onclick="openOpenBillModal()" class="bg-yellow-500 px-3 py-1.5 rounded text-sm font-semibold hover:bg-yellow-600">Open Bill</button>
      <button onclick="openHistoryModal()" class="bg-blue-500 px-3 py-1.5 rounded text-sm font-semibold hover:bg-blue-700">Riwayat 50 TRX</button>
      <button onclick="openMenuModal()" class="bg-gray-700 px-3 py-1.5 rounded text-sm font-semibold hover:bg-gray-800">Edit Menu</button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
    
    <!-- Kolom Kiri: Katalog Menu -->
    <section class="md:col-span-2 bg-white p-4 rounded shadow">
      <div class="flex gap-2 mb-4">
        <button onclick="filterCategory('All')" class="bg-gray-200 px-4 py-2 rounded font-semibold hover:bg-gray-300">Semua</button>
        <button onclick="filterCategory('Makanan')" class="bg-gray-200 px-4 py-2 rounded font-semibold hover:bg-gray-300">Makanan</button>
        <button onclick="filterCategory('Minuman')" class="bg-gray-200 px-4 py-2 rounded font-semibold hover:bg-gray-300">Minuman</button>
      </div>

      <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <!-- Card Menu dimasukkan via JS -->
      </div>
    </section>

    <!-- Kolom Kanan: Pesanan & Pembayaran -->
    <section class="bg-white p-4 rounded shadow flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-bold border-b pb-2 mb-3">Pesanan Aktif</h2>
        <div id="cart-list" class="divide-y max-h-60 overflow-y-auto mb-4">
          <p class="text-gray-400 text-center py-4">Belum ada item dipilih</p>
        </div>
      </div>

      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between text-lg font-bold">
          <span>Total:</span>
          <span id="total-val" class="text-blue-600">Rp 0</span>
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">Uang Diterima (Rp):</label>
          <input type="number" id="cash-input" class="w-full border p-2 rounded focus:outline-blue-500" placeholder="0" oninput="calcChange()">
        </div>

        <div class="flex justify-between text-md font-semibold text-green-600">
          <span>Kembalian:</span>
          <span id="change-val">Rp 0</span>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="saveOpenBill()" class="bg-yellow-500 text-white font-bold py-2 rounded hover:bg-yellow-600">OPEN BILL</button>
          <button onclick="processPayment()" class="bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">BAYAR & PRINT</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Area Print Struk Thermal -->
  <div id="receipt-print" class="hidden p-2 text-xs font-mono">
    <div class="text-center font-bold text-sm mb-1">STRUK PENJUALAN</div>
    <div id="receipt-date" class="text-center mb-2"></div>
    <hr class="border-dashed my-1">
    <div id="receipt-items" class="space-y-1"></div>
    <hr class="border-dashed my-1">
    <div class="flex justify-between font-bold"><span>Total:</span><span id="receipt-total"></span></div>
    <div class="flex justify-between"><span>Bayar:</span><span id="receipt-bayar"></span></div>
    <div class="flex justify-between"><span>Kembali:</span><span id="receipt-kembali"></span></div>
    <div class="text-center mt-3">Terima Kasih!</div>
  </div>

  <script>
    const SCRIPT_URL = "URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA"; // Masukkan URL GAS Anda di sini
    let menuData = [];
    let cart = [];
    let totalPrice = 0;

    // Fetch Menu dari Google Sheets
    async function loadMenu() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getMenu`);
        const data = await res.json();
        menuData = data.map(item => ({
          id: item[0], kategori: item[1], nama: item[2], harga: Number(item[3]), variasi: item[4]
        }));
        renderMenu(menuData);
      } catch(e) { console.error(e); }
    }

    function renderMenu(items) {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      items.forEach(item => {
        grid.innerHTML += `
          <div onclick="addToCart('${item.nama}', ${item.harga})" class="border p-3 rounded cursor-pointer hover:border-blue-500 bg-gray-50 hover:bg-blue-50 transition">
            <span class="text-xs font-semibold px-2 py-0.5 bg-blue-100 text-blue-800 rounded">${item.kategori}</span>
            <h3 class="font-bold text-sm mt-1">${item.nama}</h3>
            <p class="text-xs text-gray-500">${item.variasi ? item.variasi : '-'}</p>
            <p class="font-bold text-blue-600 mt-2">Rp ${item.harga.toLocaleString()}</p>
          </div>
        `;
      });
    }

    function filterCategory(cat) {
      if(cat === 'All') renderMenu(menuData);
      else renderMenu(menuData.filter(m => m.kategori === cat));
    }

    function addToCart(nama, harga) {
      const exist = cart.find(i => i.nama === nama);
      if(exist) exist.qty += 1;
      else cart.push({ nama, harga, qty: 1 });
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      if(cart.length === 0) {
        list.innerHTML = `<p class="text-gray-400 text-center py-4">Belum ada item dipilih</p>`;
        totalPrice = 0;
        document.getElementById('total-val').innerText = `Rp 0`;
        calcChange();
        return;
      }
      
      list.innerHTML = '';
      totalPrice = 0;
      cart.forEach((item, idx) => {
        const sub = item.harga * item.qty;
        totalPrice += sub;
        list.innerHTML += `
          <div class="flex justify-between items-center py-2">
            <div>
              <p class="font-bold text-sm">${item.nama}</p>
              <p class="text-xs text-gray-500">${item.qty} x Rp ${item.harga.toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm">Rp ${sub.toLocaleString()}</span>
              <button onclick="removeItem(${idx})" class="text-red-500 font-bold px-1 hover:bg-red-50 rounded">✕</button>
            </div>
          </div>
        `;
      });
      document.getElementById('total-val').innerText = `Rp ${totalPrice.toLocaleString()}`;
      calcChange();
    }

    function calcChange() {
      const cash = Number(document.getElementById('cash-input').value) || 0;
      const change = cash - totalPrice;
      document.getElementById('change-val').innerText = `Rp ${change > 0 ? change.toLocaleString() : 0}`;
    }

    async function processPayment() {
      const cash = Number(document.getElementById('cash-input').value) || 0;
      if(cart.length === 0 || cash < totalPrice) {
        alert("Nominal pembayaran belum cukup atau keranjang masih kosong!");
        return;
      }

      const payload = {
        action: "saveTransaction",
        id: "TRX-" + Date.now(),
        items: cart.map(i => `${i.qty}x ${i.nama}`).join(', '),
        total: totalPrice,
        bayar: cash,
        kembalian: cash - totalPrice
      };

      // Cetak Struk
      document.getElementById('receipt-date').innerText = new Date().toLocaleString();
      document.getElementById('receipt-items').innerHTML = cart.map(i => `<div class="flex justify-between"><span>${i.qty}x ${i.nama}</span><span>Rp ${(i.qty*i.harga).toLocaleString()}</span></div>`).join('');
      document.getElementById('receipt-total').innerText = `Rp ${totalPrice.toLocaleString()}`;
      document.getElementById('receipt-bayar').innerText = `Rp ${cash.toLocaleString()}`;
      document.getElementById('receipt-kembali').innerText = `Rp ${(cash - totalPrice).toLocaleString()}`;

      window.print();

      // Send to Apps Script
      await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
      cart = [];
      document.getElementById('cash-input').value = '';
      renderCart();
    }

    async function saveOpenBill() {
      if(cart.length === 0) return alert("Keranjang kosong!");
      const name = prompt("Masukkan Nama Pelanggan / Nomor Meja:");
      if(!name) return;

      const payload = {
        action: "saveOpenBill",
        id: "BILL-" + Date.now(),
        customer: name,
        items: cart.map(i => `${i.qty}x ${i.nama}`).join(', '),
        total: totalPrice
      };

      await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
      alert("Open Bill berhasil disimpan!");
      cart = [];
      renderCart();
    }

    loadMenu();
  </script>
</body>
</html>
